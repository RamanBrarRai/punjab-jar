name: Repair pnpm lockfile

on:
  push:
    branches:
      - redesign/jar-of-punjab-ui
    paths:
      - .github/workflows/repair-pnpm-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/jar-of-punjab-ui
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Regenerate lockfile from package.json
        run: pnpm install --lockfile-only

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: sync pnpm lockfile with package.json [skip ci]"
          git push origin HEAD:redesign/jar-of-punjab-ui
